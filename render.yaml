services:
  - type: web
    name: campus-eats
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false
      - key: SEED_COURIER_PASSWORD
        sync: false
      - key: SEED_MERCHANT_PASSWORD
        sync: false
